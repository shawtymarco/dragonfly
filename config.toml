
[Network]
  Address = ":19132"

[Server]
  Name = "Dragonfly Server"
  AuthEnabled = true
  DisableJoinQuitMessages = false
  MuteEmoteChat = false

[World]
  Folder = "world"
  SaveData = true
  DisableNether = false
  DisableEnd = false
  DisableFireTick = false
  DisableHopperTick = false
  DisableRedstoneTick = false
  DisableSubChunkRequests = false
  RandomTickSpeed = 0
  DisableVanillaRecipes = false

[World.Minigame]
  # All switches are opt-in. Leaving them false preserves regular Dragonfly behaviour.
  # Disable survival-only Player.Tick work: hunger, air/drowning, suffocation,
  # fire ticking, turtle-shell water breathing and elytra durability.
  DisablePlayerSurvivalTicks = false
  # Disable timed vanilla status-effect ticking. Do not enable if gameplay uses effects.
  DisablePlayerEffectTicks = false
  # Skip per-tick player/entity portal-contact processing.
  DisablePortalTicks = false
  # Let PlayerAuthInput/Player.Move own network-player collision/on-ground scans,
  # instead of repeating them in Player.Tick.
  DeduplicatePlayerCollisionTicks = false
  # Enable the reduced SetBlock mutation path when FastSetBlock is used.
  FastSetBlock = false
  # Use the reduced network block-break path (no drops/XP/exhaustion/durability).
  FastBreakBlock = false
  # Skip random block ticks and TickerBlock/block-entity ticking entirely.
  DisableBlockTicks = false
  # Skip and discard scheduled block ticks.
  DisableScheduledBlockTicks = false
  # Tick from active/viewed chunk entity lists instead of scanning the whole entity map.
  ActiveEntityTicking = false
  # Reconcile entity chunk membership from movement dirty marks, with a 20-tick audit fallback.
  MovementDirtyChunkTracking = false

[Players]
  MaxCount = 0
  MaximumChunkRadius = 32
  SaveData = true
  Folder = "players"

[Resources]
  AutoBuildPack = true
  Folder = "resources"
  Required = true
